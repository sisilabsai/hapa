services:
  # ── PostgreSQL 16 + PostGIS ──────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hapa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapa
      POSTGRES_USER: hapa
      POSTGRES_PASSWORD: hapa_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hapa_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Meilisearch ──────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: hapa_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: hapa_meili_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  # ── Go Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: hapa_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hapa:hapa_secret@postgres:5432/hapa?sslmode=disable
      REDIS_URL: redis://redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: hapa_meili_master_key
      JWT_SECRET: hapa_jwt_secret_change_in_production
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      DEEPSEEK_API_KEY: sk-d191d9d644df49fc91d989b3bf8cb83f
      PORT: 8080
      ENV: development
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["air", "-c", ".air.toml"]

  # ── Next.js Business Dashboard ───────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: development
    container_name: hapa_dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hapa_nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - dashboard

volumes:
  postgres_data:
  redis_data:
  meili_data:

networks:
  default:
    name: hapa_network
