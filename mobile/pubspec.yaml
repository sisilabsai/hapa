name: hapa
description: Hapa — Location-intelligent life platform for Africa.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3

  # Local storage & offline-first
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  shared_preferences: ^2.2.3

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Maps
  flutter_map: ^7.0.1
  latlong2: ^0.9.0

  # Push notifications
  firebase_core: ^3.2.0
  firebase_messaging: ^15.1.0

  # Media
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  video_player: ^2.9.2

  # UI utilities
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^12.0.2

  # Secure storage
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/
